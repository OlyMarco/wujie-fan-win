# wujie-fan-win configuration
# Format: key=value. [preset] section defines presets as name=target.
#   target: -1 = EC automatic control, 0-127 = manual EC duty target.
# %PROGRAMDATA% and other env vars are expanded in path values.

# ---- general ----
poll_interval_ms=2000      # tray status refresh interval
fan_max_target=123         # max EC target shown in Custom slider
fan_max_rpm=5674           # measured full-speed RPM (display denominator)
winio_service=WINIO        # WinIo kernel driver service name
state_file=%PROGRAMDATA%\wujie-fan-state.txt

# ---- max mode: target dynamically tracks CPU load between max_min and max_max ----
max_min=80
max_max=123
max_ramp_step=3            # max change per poll interval (smoothing)

# ---- fanboot: delay after logon, then apply boot_preset ----
boot_delay_ms=15000
boot_preset=silent

[preset]
auto=-1
silent=40
office=50
balanced=60
task=70
game=80
max=123
